<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Discover - BlogSpace</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div id="sidebarContainer"></div>

    <main class="main-content">

        <section class="discover-header">

            <p class="section-label">
                Explore the community
            </p>

            <h1>
                Discover
            </h1>

            <p>
                Explore popular topics and discover
                posts from writers in our community.
            </p>

        </section>

        <section class="tags-section">

            <div class="section-heading">

                <div>

                    <h2>
                        Popular Tags
                    </h2>

                </div>

            </div>


            <div
                class="tags-container"
                id="tagsContainer"
            >

                <button
                    class="tag-button active"
                    data-tag="all"
                >
                    #All
                </button>


                <button
                    class="tag-button"
                    data-tag="technology"
                >
                    #Technology
                </button>


                <button
                    class="tag-button"
                    data-tag="travel"
                >
                    #Travel
                </button>


                <button
                    class="tag-button"
                    data-tag="food"
                >
                    #Food
                </button>


                <button
                    class="tag-button"
                    data-tag="gaming"
                >
                    #Gaming
                </button>


                <button
                    class="tag-button"
                    data-tag="lifestyle"
                >
                    #Lifestyle
                </button>


                <button
                    class="tag-button"
                    data-tag="education"
                >
                    #Education
                </button>


                <button
                    class="tag-button"
                    data-tag="programming"
                >
                    #Programming
                </button>

            </div>

        </section>

        <section class="discover-posts-section">

            <div class="section-heading">

                    <h2 id="postsHeading">
                        Popular Posts
                    </h2>

            </div>

            <ul id="discoverPostsContainer" class="posts-list">

            </ul>

        </section>

    </main>
    <script src="js/helpers.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/discover.js"></script>
</body>


</html>
