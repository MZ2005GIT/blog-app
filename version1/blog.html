<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Blog - BlogSpace</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <div id="sidebarContainer"></div>


    <main class="main-content">

        <section class="blog-header" id="blogHeader">

            <h1
                id="blogName"
                class="blog-name"
            ></h1>

            <p
                id="blogBio"
                class="blog-bio"
            ></p>

        </section>

        <section class="stats-section">

            <div class="dashboard-stats">


                <div class="stat-card">

                    <h3 id="statPosts">
                        12
                    </h3>

                    <p>
                        Posts
                    </p>

                </div>


                <div class="stat-card">

                    <h3 id="statSubscribers">
                        124
                    </h3>

                    <p>
                        Subscribers
                    </p>

                </div>


                <div class="stat-card">

                    <h3 id="statComments">
                        48
                    </h3>

                    <p>
                        Comments
                    </p>

                </div>


            </div>
            
        </section>

        <section class="blog-posts">

            <h2>
                Posts
            </h2>

            <ul
                id="blogPostsContainer"
                class="my-blog-posts-list"
            >
            </ul>

        </section>

    </main>


    <script src="js/helpers.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/blog.js"></script>

</body>

</html>
