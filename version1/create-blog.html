<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Your Blog - BlogSpace</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <div id="sidebarContainer"></div>

    <main class="main-content auth-page">


        <section class="create-blog-container">

            <div class="auth-header">

                <p class="section-label">
                    Your space on BlogSpace
                </p>

                <h1>
                    Create Your Blog
                </h1>

                <p>
                    Give your blog a name and tell
                    people what it's about.
                </p>

            </div>


            <div class="auth-form-container">

                <form
                    id="createBlogForm"
                    class="auth-form"
                >

                    <div class="form-group">

                        <label for="blogName">
                            Blog Name
                        </label>

                        <input
                            type="text"
                            id="blogName"
                            name="blogName"
                            placeholder="My Awesome Blog"
                            maxlength="100"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="blogDescription">
                            Description
                        </label>

                        <textarea
                            id="blogDescription"
                            name="blogDescription"
                            rows="5"
                            maxlength="300"
                            placeholder="Tell people what your blog is about..."
                            required
                        ></textarea>

                        <small>
                            Maximum 300 characters.
                        </small>

                    </div>

                    <div class="form-group">

                        <label for="profileImage">
                            Blog Profile Image
                        </label>

                        <input
                            type="file"
                            id="profileImage"
                            name="profileImage"
                            accept="image/*"
                        >

                        <small>
                            This image will represent your blog.
                        </small>

                    </div>

                    <div class="form-group">

                        <label for="bannerImage">
                            Blog Banner
                        </label>

                        <input
                            type="file"
                            id="bannerImage"
                            name="bannerImage"
                            accept="image/*"
                        >

                        <small>
                            This image will appear at the
                            top of your public blog.
                        </small>

                    </div>


                    <button
                        type="submit"
                        class="primary-button"
                    >
                        Create My Blog
                    </button>


                    <p
                        id="createBlogMessage"
                        class="form-message"
                    ></p>


                </form>

            </div>


        </section>


    </main>
<script src="js/helpers.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/create-blog.js"></script>
</body>

</html>
