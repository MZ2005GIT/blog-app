<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Subscribers - BlogSpace</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <div id="sidebarContainer"></div>

    <main class="main-content">

        <section class="subscribers-header">

            <h1>
                Subscribers
            </h1>

            <p>
                Write and send emails to people subscribed
                to your blog.
            </p>

        </section>

        <section class="email-container">

            <h2>
                Compose Email
            </h2>


            <form
                id="subscriberEmailForm"
                class="email-form"
            >

                <div class="form-group">

                    <label for="emailSubject">
                        Subject
                    </label>

                    <input
                        type="text"
                        id="emailSubject"
                        name="emailSubject"
                        placeholder="Enter email subject"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="emailMessage">
                        Message
                    </label>

                    <textarea
                        id="emailMessage"
                        name="emailMessage"
                        rows="15"
                        placeholder="Write your email..."
                        required
                    ></textarea>

                </div>


                <div class="email-actions">

                    <button
                        type="submit"
                        id="sendEmailButton"
                        class="primary-button"
                    >
                        Send to Subscribers
                    </button>

                </div>


            </form>

        </section>


    </main>

<script src="js/helpers.js"></script>
    <script src="js/sidebar.js"></script>

</body>

</html>
