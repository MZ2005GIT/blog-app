<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Contact - BlogSpace</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div id="sidebarContainer"></div>

    <main class="main-content">

        <section class="contact-header">

            <h1>
                Contact The Developer
            </h1>

            <h3>
                    I'd love to hear from you.
            </h3>

        </section>

        <div class="contact-form-container">

            <form id="contactForm" action="#" method="POST">

                <div class="form-group">

                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your Name" required>
                </div>

                <div class="form-group">

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="You@example.com" required>
                </div>

                <div class="form-group">

                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" placeholder="What is your email about?" required>
                </div>

                <div class="form-group">

                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="7" placeholder="Write your message" required></textarea>
                </div>
                <button type="submit" class="primary-button">
                    Send Message
                </button>

                <p id="formMessage" class="form-message"></p>

            </form>
        </div>

    </main>

<script src="js/helpers.js"></script>
<script src="js/sidebar.js"></script>
</body>


</html>
