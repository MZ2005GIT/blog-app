<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - BlogSpace</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <div id="sidebarContainer"></div>

    <main class="main-content auth-page">


        <section class="auth-container">

            <div class="auth-header">

                <h1>
                    Create Your Account
                </h1>

                <p>
                    Create an account and start your
                    own blog.
                </p>

            </div>


            <div class="auth-form-container">

                <form
                    id="registerForm"
                    class="auth-form"
                >

                    <div class="form-group">

                        <label for="username">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Choose a username"
                            required
                        >

                        <small>
                            This will be visible to other users.
                        </small>

                    </div>

                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Enter your password again"
                            required
                        >

                    </div>


                    <div class="form-checkbox">

                        <input
                            type="checkbox"
                            id="terms"
                            name="terms"
                            required
                        >

                        <label for="terms">
                            I agree to the Terms of Service
                            and Privacy Policy.
                        </label>

                    </div>

                    <button
                        type="submit"
                        class="primary-button"
                    >
                        Create Account
                    </button>

                    <p
                        id="registerMessage"
                        class="form-message"
                    ></p>


                </form>


                <p class="auth-switch">

                    Already have an account?

                    <a href="login.html">
                        Log in
                    </a>

                </p>

            </div>

        </section>


    </main>
<script src="js/helpers.js"></script>
<script src="js/auth.js"></script>
<script src="js/storage.js"></script>
<script src="js/sidebar.js"></script>
</body>

</html>
